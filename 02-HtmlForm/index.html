<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">Name: </label>
        <input maxlength=5 type="text" id="name" name="name" placeholder="enter your name..." required><br>
        <label for="number">Fav number: </label>
        <input min="6" max="30" type="number" name="number" id="number" placeholder="enter your fav number..." required><br>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" placeholder="enter your email..." required><br>
        <label for="passw">Password: </label>
        <input type="password" name="passw" id="passw" placeholder="enter your password..." required><br>
        <span>Gender: </span>
        <input type="radio" name="gender" id="male" required>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" required checked>
        <label for="female">Female</label><br>
        <label for="country">Country: </label>
        <select name="country" id="country">
            <option value="usa">USA</option>
            <option value="az">Azerbaijan</option>
            <option value="gr">Germany</option>
            <option value="ru">Russia</option>
            <option value="tr">Turkey</option>
        </select><br>
        <label for="message">Message: </label><br>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="enter your message..." required></textarea><br>
        <label for="subsc">Subscribe to newsletter: </label>
        <input type="checkbox" it="subsc" name="subsc" required><br>
        <label for="upfile">Upload file: </label>
        <input multiple type="file" name="upfile" id="upfile" required><br>
        <label for="birth-date">Birthdate: </label>
        <input type="date" name="birth-date" id="birth-date" required><br>
        <label for="fav-color">Favorite Color: </label>
        <input type="color" name="fav-color" id="fav-color" required><br>
        <label for="website">Personal Website: </label>
        <input type="text" name="website" id="website" placeholder="enter your website..." required><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    
</body>
</html>
