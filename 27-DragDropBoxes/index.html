<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DragDropBoxes</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="upBox">
      <div class="box">
        <div class="a-tier tierBox">A Tier</div>
        <div class="box1"></div>
      </div>
      <div class="box">
        <div class="b-tier tierBox">B Tier</div>
        <div class="box2"></div>
      </div>
      <div class="box">
        <div class="c-tier tierBox">C Tier</div>
        <div class="box3"></div>
      </div>
    </div>

    <div class="bottomBox box">
      <div class="unrankedBox tierBox">Unranked</div>
      <div class="boxs-wrapper">
        <div draggable="true" class="blue drag-down-box"></div>
        <div draggable="true" class="red drag-down-box"></div>
        <div draggable="true" class="green drag-down-box"></div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
