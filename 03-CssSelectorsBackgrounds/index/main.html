<!DOCTYPE html>
<html lang="en">

        <a href="./about.html">About</a>

<body>
    <h1>Registration Form</h1>
    <br>
    <form action="">
        <label for="fname">First Name: </label>
        <input type="text" name="fname" id="fname"><br>
        <label for="lname">Last name: </label>
        <input type="text" name="lname" id="lname"><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br>
        <label for="passw">Password</label>
        <input type="password" name="passw" id="passw"><br>
        <label for="bdate">Date of Birth</label>
        <input type="date" name="bdate" id="bdate"><br>
        <span id="genderid">Gender: </span>
        <input type="radio" name="gender" id="male" checked>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="other">
        <label for="other">Others</label><br>
        <label for="tel">Mobile</label>
        <input type="number" name="tel" id="tel"><br>
        <label for="adress">Adress</label>
        <textarea name="adress" id="adress"></textarea><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Cancel</button>
    </form>
    
</body>
</html>
